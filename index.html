<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Bookmarklet Examples</title>
<style>
* {
 font-family: sans-serif, system-ui, helvetica;
 box-sizing: border-box;
}
h1 {
 margin-left: 30px;
}
div.sideNav,
div.sideNav a,
div.sideNav h3,
div.sideNav a[data-active="0"] {
 background: #021;
 color: white;
}
div.sideNav {
 display: inline-block;
 position: absolute;
 width: 15%; 
 min-height: 500px;
 margin-left: 30px;
 padding: 20px 5px;
 top: auto;
 border: 0px solid;
 border-radius: 5px; 
}
div.sideNav a {
 display: block;
 padding: 10px;
 text-decoration: none; 
}
div.sideNav a[data-active="1"] {
 background: white;
 color: #021; 
}
main.examples {
 display: inline-block;
 position: relative;
 float: right;
 width: 80%;
 right: 20px;
 margin-left: 30px;
 min-height: 800px;
 height: auto;
 max-height: none;
}
iframe {
 display: inline-block;
 position: relative;
 width: 100%;
 height: 100%;
}
</style>
<script>
 var slide = 0;
</script>
</head>

<body>

<h1>Bookmarklets Examples</h1><hr>

<div class="sideNav">
 <h3>ChatGPT - Paste Ready Bookmark Response</h3><hr>
 <a href="examples/chatGPT_Bookmark_Schedule.html" 
    data-active="0"
    target="examples"
    onmouseover="slide = 1;"
    onclick="sizeExample(this)">ChatGPT - Schedule</a>
 <a href="examples/chatGPT_Bookmark_BroadwayMusical.html" 
    data-active="0"
    target="examples"
    onmouseover="slide = 1;"
    onclick="sizeExample(this)">ChatGPT - Broadway Musical</a>
 <a href="examples/chatGPT_Bookmark_GreenMarketing.html" 
    data-active="0"
    target="examples"
    onmouseover="slide = 1;"
    onclick="sizeExample(this)">ChatGPT - Green Marketing</a>
 <a href="examples/chatGPT_Bookmark_IntroToComputerScience.html" 
    data-active="0"
    target="examples"
    onmouseover="slide = 1;"
    onclick="sizeExample(this)">ChatGPT - Intro To Computer Science</a>
 <a href="examples/chatGPT_Bookmark_SocialMediaMarketing.html" 
    data-active="0"
    target="examples"
    onmouseover="slide = 1;"
    onclick="sizeExample(this)">ChatGPT - Social Media Marketing</a>
<!--    
 RECYCLE - Copy/Paste
 <a href="examples/chatGPT_Bookmark_CHANGE_PAGE.html" 
    data-active="0"
    target="examples"
    onmouseover="slide = 1;"
    onclick="sizeExample(this)">ChatGPT - CHANGE_TEXT</a>
-->    
</div>

<main class="examples">
 <iframe name="examples" id="examples" 
  src="examples/chatGPT_Bookmark_Schedule.html"frameborder="0"></iframe>
</main>

<script>
 var navDataActive = document.querySelectorAll("[data-active]");
 var navDataActiveLen = navDataActive.length;
 var example = document.getElementsByTagName("iframe")[0];
 var exampleHasBeenClicked = 0;
 var sizeToExample, exampleHeight;
 // The links the slide show steps: the five whose target is the frame, named rather than
 // collected from every <a> on the page. An anchor without that target navigates the top level,
 // so a link added anywhere here - a README link, a gist link, a short - used to send a reader
 // off the site within one cycle of nobody touching the page.
 var exampleLinks = document.querySelectorAll("div.sideNav a[target='examples']");
 
 // Resize iframe to fit example.
 function sizeExample(cur) {
  if (slide == 1) { exampleHasBeenClicked = 1; }
  sizeToExample = setInterval(function() {
   let exampleFrame = example.contentWindow || example.document;  
   if (exampleFrame.contentWindow) exampleFrame = exampleFrame.contentWindow;
   else exampleFrame = exampleFrame.document;
   let frameBody = exampleFrame.body;  
   if (frameBody) exampleHeight = frameBody.scrollHeight;
   if (example.height != exampleHeight || example.height != exampleHeight+100) {
    if (exampleHeight < 800) {
     example.style.height = exampleHeight + 100 + "px";
    } else {
     example.style.height = exampleHeight + "px";
    }
   } else {
    return;
   }
   
  }, 100);  
  setTimeout(function() { clearInterval(sizeToExample); }, 300);
  let resetDataSets = function() {
   for (i = 0; i < navDataActiveLen; i++) {
    navDataActive[i].dataset.active = "0";
   }
  };  
  resetDataSets();
  cur.dataset.active = "1";  
 }
 
 // Show an example without adding a session history entry. Clicking a link whose target is the
 // frame is a frame navigation, and a frame navigation is an entry: left alone, the page grew one
 // entry every three seconds, so Back rewound the slide show rather than leaving the gallery.
 // Replacing the frame's own location leaves history.length where it is, and only a reader's own
 // click pushes an entry. sizeExample does the rest, as it does for a click.
 function replaceExample(cur) {
  try {
   example.contentWindow.location.replace(cur.href);
  } catch (err) {
   // A frame this page cannot reach into. The examples share its origin, so this is the odd
   // case rather than the usual one, and the attribute is the only way left to show the page.
   example.setAttribute("src", cur.href);
  }
  sizeExample(cur);
 }

 // Play slide show of examples until clicked.
 var curExample = 0;
 function exampleSlideShow() {
  if (exampleHasBeenClicked == 0) {
   let curEx = exampleLinks;
   if (curEx.length > 0) {
    replaceExample(curEx[curExample]);
    if (curExample == curEx.length-1) {
     curExample = 0;
    } else {
     curExample++;
    }
   }
   setTimeout(exampleSlideShow, 3000);
  }
 }
 exampleSlideShow();
</script>
</body>
</html>
